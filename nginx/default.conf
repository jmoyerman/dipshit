server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Forces per-request resolution so the UI
    # survives the moderator being recreated with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $moderator http://moderator:8000;
        proxy_pass $moderator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $moderator http://moderator:8000;
        proxy_pass $moderator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
